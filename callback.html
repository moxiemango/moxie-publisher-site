<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorization – Moxie Mango Publisher</title><style>:root{--bg:#f6f7f3;--fg:#1a231e;--mut:#5e6a62;--acc:#e8920c}@media (prefers-color-scheme:dark){:root{--bg:#121713;--fg:#e7ece6;--mut:#9aa79e}}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:720px;margin:0 auto;padding:40px 20px}h1{font-size:28px;margin:0 0 4px}h2{font-size:19px;margin:28px 0 6px}.m{color:var(--mut);font-size:14px}a{color:var(--acc)}code{background:rgba(127,127,127,.15);padding:2px 6px;border-radius:4px}</style></head><body><main>
<h1>Authorization received</h1>
<p>Copy this code back into the Moxie Mango Publisher setup script. It works once and expires within minutes.</p>
<p><code id="c">–</code></p>
<p class="m" id="s"></p>
<script>const p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||'No code in the address. Start the connection again.';if(p.get('error'))document.getElementById('s').textContent='Error: '+p.get('error');</script>
</main></body></html>
